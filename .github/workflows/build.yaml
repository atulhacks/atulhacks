name: README build
on:
  push:
    branches: [main]
    paths:
      - today.py
      - requirements.txt
      - dark_mode.svg
      - light_mode.svg
      - tests/test_today.py
      - .github/workflows/build.yaml
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test updater
        run: python -m unittest discover -s tests -p test_today.py -v
      - name: Update profile cards
        env:
          GH_TOKEN: ${{ github.token }}
          USER_NAME: atulhacks
        run: python today.py
      - name: Commit updated cards
        run: |
          git config user.name "atulhacks"
          git config user.email "80306722+atulhacks@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/public-stats.json
          if git diff --cached --quiet; then
            echo "Profile statistics are already current."
          else
            git commit -m "Update public profile stats [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
